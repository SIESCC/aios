databases:
  - name: aios-db
    databaseName: aios_db
    user: aios
    plan: free

services:
  - type: redis
    name: aios-redis
    ipAllowList: [] # empty means all IP addresses are allowed (Render internal traffic is governed by this too depending on config)
    plan: free
    maxmemoryPolicy: noeviction

  - type: web
    name: aios-backend
    env: docker
    rootDir: backend
    dockerfilePath: ../docker/backend.Dockerfile
    plan: free
    envVars:

      - key: DATABASE_URL
        fromDatabase:
          name: aios-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: aios-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  - type: worker
    name: aios-workers
    env: docker
    rootDir: workers
    dockerfilePath: ../docker/workers.Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aios-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: aios-redis
          property: connectionString
      - key: BACKEND_API_URL
        value: "https://aios-backend-0vpb.onrender.com/api"
