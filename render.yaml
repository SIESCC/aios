databases:
  - name: aios-db
    databaseName: aios_db
    user: aios
    plan: free

services:
  - type: redis
    name: aios-redis
    ipAllowList: [] # empty means all IP addresses are allowed (Render internal traffic is governed by this too depending on config)
    plan: free
    maxmemoryPolicy: noeviction

  - type: web
    name: aios-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npx prisma generate && npx prisma db push && node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20.10.0"

      - key: DATABASE_URL
        fromDatabase:
          name: aios-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: aios-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  - type: web
    name: aios-workers
    env: python
    rootDir: workers
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python dummy_server.py & python -m pipeline.orchestrator
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.2"
      - key: DATABASE_URL
        fromDatabase:
          name: aios-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: aios-redis
          property: connectionString
      - key: BACKEND_API_URL
        value: "https://aios-backend-0vpb.onrender.com/api"
